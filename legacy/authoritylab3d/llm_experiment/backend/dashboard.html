<!doctype html><meta charset="utf-8"><title>Equal Standing Lab observer</title>
<main>
  <header><div><strong>Equal Standing Lab · live observer</strong><small>public history, visible model messages/tool calls, sealed-count metadata, and technical health</small></div><div class="auth"><label>Observer token <input id="token" type="password" autocomplete="off"></label><button id="connect">Connect</button><span id="status">disconnected</span></div></header>
  <section id="overview"></section>
  <section class="columns"><article><h2>Public record</h2><div id="board" class="feed"></div></article><article><h2>Auditable execution</h2><div id="audit" class="feed"></div></article></section>
</main>
<style>
  :root{color-scheme:dark;font-family:ui-sans-serif,system-ui,sans-serif;background:#10131a;color:#e9edf5}body{margin:0;background:#10131a}main{max-width:1500px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;border-bottom:1px solid #2a3140;padding-bottom:16px}strong{font-size:20px;display:block}small{display:block;color:#9aa6b8;margin-top:4px}.auth{display:flex;gap:8px;align-items:center;font-size:13px}input{background:#171d28;border:1px solid #354055;color:#e9edf5;padding:7px;border-radius:5px}button{background:#5c8dff;color:#071124;border:0;border-radius:5px;padding:8px 12px;font-weight:700}#status{color:#9aa6b8;min-width:125px}#overview{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin:18px 0}.metric{border:1px solid #2a3140;border-radius:8px;padding:12px;background:#171d28}.metric b{display:block;font-size:16px;overflow-wrap:anywhere}.metric span{display:block;color:#9aa6b8;font-size:11px;text-transform:uppercase;margin-bottom:5px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}article{border:1px solid #2a3140;border-radius:8px;background:#141923;min-height:520px}h2{font-size:15px;margin:0;padding:12px 14px;border-bottom:1px solid #2a3140}.feed{padding:8px 12px;max-height:72vh;overflow:auto}.entry{padding:10px 0;border-bottom:1px solid #222a38;font-size:13px;line-height:1.45}.entry:last-child{border:0}.who{font-weight:700;color:#9ec1ff}.kind{color:#ffcb7d;font-weight:600}.time{color:#7e8a9d;font-size:11px;margin-left:8px}.detail{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:4px;color:#d8deea}.muted{color:#9aa6b8}@media(max-width:900px){header,.auth{align-items:flex-start;flex-direction:column}#overview{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}}
</style>
<script>
const $=id=>document.getElementById(id);let timer;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function metric(label,value){return `<div class="metric"><span>${esc(label)}</span><b>${esc(value)}</b></div>`}
function pretty(entry){const d=entry.data||{};if(entry.kind==='tool_call')return `${esc(d.name)} ${esc(JSON.stringify(d.arguments||{}))} → ${esc(JSON.stringify(d.result||{}))}`;if(entry.kind==='model_response'){const calls=(d.function_calls||[]).map(x=>`${x.name}(${x.arguments})`).join(', ');return `${calls?`calls: ${esc(calls)}`:''}${d.visible_text?`${calls?'\n':''}${esc(d.visible_text)}`:''}`||'empty visible output';}if(entry.kind==='model_request_failed')return esc(`attempt ${d.attempt}: ${d.error}`);return esc(JSON.stringify(d));}
function render(s){$('status').textContent=s.status==='running'?`running · ${s.active}`:s.status;$('overview').innerHTML=[metric('run',s.run_id),metric('mode',s.mode),metric('status',s.status),metric('round',s.round),metric('phase',s.phase),metric('active',s.active||'—'),metric('shared reserve',s.shared_reserve)].join('');$('board').innerHTML=(s.board||[]).map(x=>`<div class="entry"><span class="who">${esc(x.from)}</span><span class="time">round ${esc(x.round)} · ${esc(x.kind)}</span><div class="detail">${esc(x.text)}</div></div>`).join('')||'<div class="entry muted">No public record yet.</div>';const events=(s.recent_audit||[]).slice().reverse();$('audit').innerHTML=events.map(x=>`<div class="entry"><span class="kind">${esc(x.kind)}</span> <span class="who">${esc(x.actor)}</span><span class="time">#${esc(x.seq)} · ${esc((x.at||'').replace('T',' ').replace('+00:00','Z'))}</span><div class="detail">${pretty(x)}</div></div>`).join('')||'<div class="entry muted">No events yet.</div>';}
async function tick(){const token=$('token').value;try{const r=await fetch('/v1/observer/snapshot',{headers:{'X-Dashboard-Token':token}});if(!r.ok)throw new Error(r.status===403?'invalid observer token':`HTTP ${r.status}`);render(await r.json());}catch(e){$('status').textContent=e.message;}}
$('connect').onclick=()=>{clearInterval(timer);tick();timer=setInterval(tick,1500)};
</script>
