[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-economic"
version = "1.0.0"
description = "Auditable multi-agent institutional economy experiments and MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.10,<2"]
dev = [
  "pytest>=8,<10",
  "fastapi==0.115.6",
  "openai==1.77.0",
]

[project.scripts]
agent-economic-mcp = "agent_economic_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["mcp/agent_economic_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests", "runtime/authority_world/tests"]
pythonpath = ["mcp", "runtime/authority_world"]
