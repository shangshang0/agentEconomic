services:
  gateway:
    build:
      context: /srv/authoritylab/authority-world-v2-real72-ranked-v5
      dockerfile: Dockerfile.gateway
    environment:
      GATEWAY_TOKEN: ${GATEWAY_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      MODEL: ${MODEL}
      OPENAI_API_STYLE: ${OPENAI_API_STYLE}
      GATEWAY_DATA_DIR: /gateway-data
    volumes:
      - /data/authoritylab/strict72-4g-gateway:/gateway-data
    ports:
      - "127.0.0.1:18110:8101"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
